<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Ledger</title>
<link rel="icon" type="image/png" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="dashboard">

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-mark"><img class="brand-logo brand-logo-lg" src="assets/images/logo.svg" alt="" /></div>
</div>
<div id="toast-stack" class="toast-stack"></div>

<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div id="app-shell" class="app-shell">
  <header class="mobile-topbar">
    <button class="hamburger" id="menu-btn" aria-label="Open menu">&#9776;</button>
    <span class="mobile-title"><img class="brand-logo brand-logo-sm" src="assets/images/logo.svg" alt="" /> Ledger</span>
  </header>
  <div id="nav-backdrop" class="nav-backdrop"></div>

  <aside class="sidebar">
    <a class="sidebar-brand" href="dashboard.html" title="Ledger — home"><img class="brand-logo" src="assets/images/logo.svg" alt="Ledger logo" /><span class="brand-name">Ledger</span></a>
    <button class="sidebar-collapse" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
    </button>

    <nav class="sidebar-nav">
      <p class="nav-group-label">Menu</p>
      <a class="nav-tab active" href="dashboard.html" title="Dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span class="nav-label">Dashboard</span></a>
      <a class="nav-tab" href="expenses.html" title="Expenses"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg><span class="nav-label">Expenses</span></a>
      <a class="nav-tab" href="income.html" title="Income"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg><span class="nav-label">Income</span></a>
      <a class="nav-tab" href="analytics.html" title="Analytics"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.05-.998.398-.998.95v8a1 1 0 0 0 1 1h8Z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg><span class="nav-label">Analytics</span></a>
      <a class="nav-tab" href="connectors.html" title="Connectors"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg><span class="nav-label">Connectors</span></a>
      <a class="nav-tab" href="settings.html" title="Settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-label">Settings</span></a>
    </nav>

    <div class="sidebar-footer" id="sidebar-user"></div>
  </aside>

  <main class="main">
    <header class="view-header">
      <div>
        <p class="eyebrow-plain">This month</p>
        <h1 id="month-label">—</h1>
      </div>
      <div class="row-actions">
        <button class="btn btn-ghost" id="quick-add-income-btn">+ Add income</button>
        <button class="btn btn-primary" id="quick-add-btn">+ Add expense</button>
      </div>
    </header>

    <div class="stat-row">
      <div class="stat-card stat-card-balance">
        <p class="stat-label">Left balance</p>
        <p class="stat-figure" id="stat-balance">₹0.00</p>
      </div>
      <div class="stat-card stat-card-hero stat-card-spent">
        <p class="stat-label">Spent this month</p>
        <p class="stat-figure" id="stat-month-total">₹0</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Earned this month</p>
        <p class="stat-figure stat-figure-sm" id="stat-income">₹0</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Spent today</p>
        <p class="stat-figure stat-figure-sm" id="stat-today">₹0.00</p>
      </div>
    </div>

    <div class="panel wave-panel">
      <h2 class="panel-title">Last 7 days</h2>
      <div id="wave-chart" class="wave-chart"></div>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <h2 class="panel-title">By category</h2>
        <div class="donut-wrap">
          <svg id="donut-chart" viewBox="0 0 120 120" class="donut-svg"></svg>
          <div class="donut-center">
            <span class="donut-center-label">Total</span>
            <span class="donut-center-figure" id="donut-center-figure">₹0</span>
          </div>
        </div>
        <div id="category-breakdown" class="category-breakdown"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title">Recent entries</h2>
        <div id="recent-list" class="recent-list"></div>
      </div>
    </div>

  </main>
</div>

<!-- ============ EXPENSE MODAL ============ -->
<div id="expense-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">Add expense</h2>
    <form id="expense-form">
      <input type="hidden" id="expense-id" />
      <label>Amount
        <input type="number" id="expense-amount" min="0.01" step="0.01" required />
      </label>
      <label>Name
        <input type="text" id="expense-name" maxlength="120" required placeholder="e.g. Groceries at DMart" />
      </label>
      <label>Category
        <select id="expense-category" required></select>
      </label>
      <label>Payment method
        <select id="expense-method" required>
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="credit_card">Credit card</option>
          <option value="debit_card">Debit card</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="wallet">Wallet</option>
        </select>
      </label>
      <label>Date
        <input type="date" id="expense-date" required />
      </label>
      <label>Note (optional)
        <input type="text" id="expense-note" maxlength="200" />
      </label>
      <p class="auth-error" id="expense-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ INCOME MODAL ============ -->
<div id="income-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="income-modal-title">Add income</h2>
    <form id="income-form">
      <input type="hidden" id="income-id" />
      <label>Amount
        <input type="number" id="income-amount" min="0.01" step="0.01" required />
      </label>
      <label>Name
        <input type="text" id="income-name" maxlength="120" required placeholder="e.g. October salary" />
      </label>
      <label>Source
        <select id="income-category" required></select>
      </label>
      <label>Payment method
        <select id="income-method" required>
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="credit_card">Credit card</option>
          <option value="debit_card">Debit card</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="wallet">Wallet</option>
        </select>
      </label>
      <label>Date
        <input type="date" id="income-date" required />
      </label>
      <label>Note (optional)
        <input type="text" id="income-note" maxlength="200" />
      </label>
      <p class="auth-error" id="income-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="income-modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="income-modal-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/expenses.js"></script>
<script src="js/income.js"></script>
</body>
</html>
