<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expenses — Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231f3a34'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23a9843a' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="expenses">

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-mark">§</div>
</div>
<div id="toast-stack" class="toast-stack"></div>

<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div id="app-shell" class="app-shell">
  <header class="mobile-topbar">
    <button class="hamburger" id="menu-btn" aria-label="Open menu">&#9776;</button>
    <span class="mobile-title"><span class="brand-mark">§</span> Ledger</span>
  </header>
  <div id="nav-backdrop" class="nav-backdrop"></div>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">Ledger</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-tab" href="dashboard.html">Dashboard</a>
      <a class="nav-tab active" href="expenses.html">Expenses</a>
      <a class="nav-tab" href="income.html">Income</a>
      <a class="nav-tab" href="analytics.html">Analytics</a>
        <a class="nav-tab" href="connectors.html">Connectors</a>
        <a class="nav-tab" href="settings.html">Settings</a>
    </nav>

    <div class="sidebar-footer">
      <p class="sidebar-email" id="user-email"></p>
      <button class="btn btn-ghost btn-block" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <header class="view-header">
      <div>
        <p class="eyebrow-plain">All entries</p>
        <h1>Expenses</h1>
      </div>
      <div class="row-actions">
        <a class="btn btn-ghost" href="/api/reports/expenses.csv" id="export-csv-btn">Export CSV</a>
        <a class="btn btn-ghost" href="/api/reports/expenses.pdf" id="export-pdf-btn">PDF report</a>
        <button class="btn btn-primary" id="add-expense-btn">+ Add expense</button>
      </div>
    </header>

    <div class="filter-bar">
      <input type="text" id="filter-search" placeholder="Search notes…" />
      <select id="filter-category">
        <option value="">All categories</option>
      </select>
      <input type="date" id="filter-from" />
      <span class="filter-sep">to</span>
      <input type="date" id="filter-to" />
      <button class="btn btn-ghost" id="filter-clear">Clear</button>
    </div>

    <div class="ledger-table-wrap">
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Note</th>
            <th class="align-right">Amount</th>
            <th class="align-right">—</th>
          </tr>
        </thead>
        <tbody id="expenses-tbody"></tbody>
      </table>
      <p id="expenses-empty" class="empty-state hidden">No entries yet. The page is blank — add the first line.</p>
    </div>
  </main>
</div>

<!-- ============ EXPENSE MODAL ============ -->
<div id="expense-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">Add expense</h2>
    <form id="expense-form">
      <input type="hidden" id="expense-id" />
      <label>Amount
        <input type="number" id="expense-amount" min="0.01" step="0.01" required />
      </label>
      <label>Category
        <select id="expense-category" required></select>
      </label>
      <label>Payment method
        <select id="expense-method" required>
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="credit_card">Credit card</option>
          <option value="debit_card">Debit card</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="wallet">Wallet</option>
        </select>
      </label>
      <label>Date
        <input type="date" id="expense-date" required />
      </label>
      <label>Note (optional)
        <input type="text" id="expense-note" maxlength="200" />
      </label>
      <p class="auth-error" id="expense-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/expenses.js"></script>
</body>
</html>
