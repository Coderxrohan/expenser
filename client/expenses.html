<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expenses — Ledger</title>
<link rel="icon" type="image/png" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="expenses">

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-mark"><img class="brand-logo brand-logo-lg" src="assets/images/logo.svg" alt="" /></div>
</div>
<div id="toast-stack" class="toast-stack"></div>

<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div id="app-shell" class="app-shell">
  <header class="mobile-topbar">
    <button class="hamburger" id="menu-btn" aria-label="Open menu">&#9776;</button>
    <span class="mobile-title"><img class="brand-logo brand-logo-sm" src="assets/images/logo.svg" alt="" /> Ledger</span>
  </header>
  <div id="nav-backdrop" class="nav-backdrop"></div>

  <aside class="sidebar">
    <a class="sidebar-brand" href="dashboard.html" title="Ledger — home"><img class="brand-logo" src="assets/images/logo.svg" alt="Ledger logo" /><span class="brand-name">Ledger</span></a>
    <button class="sidebar-collapse" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
    </button>

    <nav class="sidebar-nav">
      <p class="nav-group-label">Menu</p>
      <a class="nav-tab" href="dashboard.html" title="Dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span class="nav-label">Dashboard</span></a>
      <a class="nav-tab active" href="expenses.html" title="Expenses"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg><span class="nav-label">Expenses</span></a>
      <a class="nav-tab" href="income.html" title="Income"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg><span class="nav-label">Income</span></a>
      <a class="nav-tab" href="analytics.html" title="Analytics"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.05-.998.398-.998.95v8a1 1 0 0 0 1 1h8Z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg><span class="nav-label">Analytics</span></a>
      <a class="nav-tab" href="connectors.html" title="Connectors"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg><span class="nav-label">Connectors</span></a>
      <a class="nav-tab" href="settings.html" title="Settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-label">Settings</span></a>
    </nav>

    <div class="sidebar-footer" id="sidebar-user"></div>
  </aside>

  <main class="main">
    <header class="view-header">
      <div>
        <p class="eyebrow-plain">All entries</p>
        <h1>Expenses</h1>
      </div>
      <div class="row-actions">
        <a class="btn btn-ghost" href="/api/reports/expenses.csv" id="export-csv-btn">Export CSV</a>
        <a class="btn btn-ghost" href="/api/reports/expenses.pdf" id="export-pdf-btn">PDF report</a>
        <button class="btn btn-primary" id="add-expense-btn">+ Add expense</button>
      </div>
    </header>

    <div class="filter-bar">
      <input type="text" id="filter-search" placeholder="Search name…" />
      <select id="filter-category">
        <option value="">All categories</option>
      </select>
      <input type="date" id="filter-from" />
      <span class="filter-sep">to</span>
      <input type="date" id="filter-to" />
      <button class="btn btn-ghost" id="filter-clear">Clear</button>
    </div>

    <div class="ledger-table-wrap">
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Name</th>
            <th class="align-right">Amount</th>
            <th class="align-right">—</th>
          </tr>
        </thead>
        <tbody id="expenses-tbody"></tbody>
      </table>
      <p id="expenses-empty" class="empty-state hidden">No entries yet. The page is blank — add the first line.</p>
    </div>
  </main>
</div>

<!-- ============ EXPENSE MODAL ============ -->
<div id="expense-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">Add expense</h2>
    <form id="expense-form">
      <input type="hidden" id="expense-id" />
      <label>Amount
        <input type="number" id="expense-amount" min="0.01" step="0.01" required />
      </label>
      <label>Name
        <input type="text" id="expense-name" maxlength="120" required placeholder="e.g. Groceries at DMart" />
      </label>
      <label>Category
        <select id="expense-category" required></select>
      </label>
      <label>Payment method
        <select id="expense-method" required>
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="credit_card">Credit card</option>
          <option value="debit_card">Debit card</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="wallet">Wallet</option>
        </select>
      </label>
      <label>Date
        <input type="date" id="expense-date" required />
      </label>
      <label>Note (optional)
        <input type="text" id="expense-note" maxlength="200" />
      </label>
      <p class="auth-error" id="expense-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/expenses.js"></script>
</body>
</html>
