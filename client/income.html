<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Income — Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231f3a34'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23a9843a' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="income">

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-mark">§</div>
</div>
<div id="toast-stack" class="toast-stack"></div>

<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div id="app-shell" class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">Ledger</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-tab" href="dashboard.html">Dashboard</a>
      <a class="nav-tab" href="expenses.html">Expenses</a>
      <a class="nav-tab active" href="income.html">Income</a>
      <a class="nav-tab" href="analytics.html">Analytics</a>
        <a class="nav-tab" href="connectors.html">Connectors</a>
        <a class="nav-tab" href="settings.html">Settings</a>
    </nav>

    <div class="sidebar-footer">
      <p class="sidebar-email" id="user-email"></p>
      <button class="btn btn-ghost btn-block" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <header class="view-header">
      <div>
        <p class="eyebrow-plain">Money in</p>
        <h1>Income</h1>
      </div>
      <div class="row-actions">
        <a class="btn btn-ghost" href="/api/reports/incomes.csv" id="income-export-csv-btn">Export CSV</a>
        <a class="btn btn-ghost" href="/api/reports/incomes.pdf" id="income-export-pdf-btn">PDF report</a>
        <button class="btn btn-primary" id="add-income-btn">+ Add income</button>
      </div>
    </header>

    <div class="filter-bar">
      <input type="text" id="income-filter-search" placeholder="Search notes…" />
      <select id="income-filter-category">
        <option value="">All sources</option>
      </select>
      <input type="date" id="income-filter-from" />
      <span class="filter-sep">to</span>
      <input type="date" id="income-filter-to" />
      <button class="btn btn-ghost" id="income-filter-clear">Clear</button>
    </div>

    <div class="ledger-table-wrap">
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Source</th>
            <th>Note</th>
            <th class="align-right">Amount</th>
            <th class="align-right">—</th>
          </tr>
        </thead>
        <tbody id="incomes-tbody"></tbody>
      </table>
      <p id="incomes-empty" class="empty-state hidden">No income entries yet. Add the first one.</p>
    </div>
  </main>
</div>

<!-- ============ INCOME MODAL ============ -->
<div id="income-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="income-modal-title">Add income</h2>
    <form id="income-form">
      <input type="hidden" id="income-id" />
      <label>Amount
        <input type="number" id="income-amount" min="0.01" step="0.01" required />
      </label>
      <label>Source
        <select id="income-category" required></select>
      </label>
      <label>Payment method
        <select id="income-method" required>
          <option value="cash">Cash</option>
          <option value="upi">UPI</option>
          <option value="credit_card">Credit card</option>
          <option value="debit_card">Debit card</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="wallet">Wallet</option>
        </select>
      </label>
      <label>Date
        <input type="date" id="income-date" required />
      </label>
      <label>Note (optional)
        <input type="text" id="income-note" maxlength="200" />
      </label>
      <p class="auth-error" id="income-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="income-modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="income-modal-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/income.js"></script>
</body>
</html>
