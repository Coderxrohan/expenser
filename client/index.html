<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Expense Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231f3a34'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23a9843a' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .landing {
    min-height: 100vh;
    background: var(--spine);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .landing .brand-mark { font-size: 3.4rem; }
  .landing .brand-name { font-size: 2.4rem; color: var(--paper); }
  .landing h1 { font-size: 1.4rem; font-weight: 400; color: rgba(251,250,245,0.8); margin: 0.5rem 0 2.25rem; }
  .landing-actions { display: flex; gap: 1rem; }
  .landing .btn-ghost { border-color: rgba(251,250,245,0.35); color: var(--paper); }
  .landing .btn-ghost:hover { border-color: var(--paper); }
  .landing .btn-primary { background: var(--brass); border-color: var(--brass); color: var(--spine); }
  .landing .btn-primary:hover { background: #c9b37a; }
  .landing-foot { margin-top: 3.5rem; font-size: 0.8rem; color: rgba(251,250,245,0.45); }
</style>
</head>
<body>
  <section class="landing">
    <div class="auth-brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">Ledger</span>
    </div>
    <h1>A quiet place to keep the books.</h1>
    <div class="landing-actions">
      <a class="btn btn-primary" href="login.html">Log in</a>
      <a class="btn btn-ghost" href="login.html?tab=signup">Create account</a>
    </div>
    <p class="landing-foot">Dashboard · Budgets · Analytics · Telegram bot · Receipt OCR</p>
  </section>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Already signed in? Skip the landing page.
    if (window.supabase && CONFIG.supabaseUrl) {
      window.supabase
        .createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey)
        .auth.getSession()
        .then(({ data }) => { if (data.session) location.href = "dashboard.html"; });
    }
  </script>
</body>
</html>
