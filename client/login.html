<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Ledger</title>
<link rel="icon" type="image/png" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-mark"><img class="brand-logo brand-logo-lg" src="assets/images/logo.svg" alt="" /></div>
</div>

<section id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand"><img class="brand-logo" src="assets/images/logo.svg" alt="Ledger logo" /><span class="brand-name">Ledger</span></div>
    <p class="auth-tagline">A quiet place to keep the books.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Log in</button>
      <button class="auth-tab" data-tab="signup">Sign up</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Email
        <input type="email" id="login-email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
      <p class="auth-error" id="login-error"></p>
      <button type="button" class="auth-link" id="forgot-link">Forgot password?</button>
    </form>

    <form id="reset-form" class="auth-form hidden">
      <p class="auth-note">Enter your account email and we'll send a reset link.</p>
      <label>Email
        <input type="email" id="reset-email" required autocomplete="email" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      <button type="button" class="auth-link" id="reset-back">Back to log in</button>
      <p class="auth-error" id="reset-error"></p>
      <p class="auth-note" id="reset-note"></p>
    </form>

    <form id="newpass-form" class="auth-form hidden">
      <p class="auth-note">Choose a new password for your account.</p>
      <label>New password
        <input type="password" id="newpass-password" required minlength="6" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Set new password</button>
      <p class="auth-error" id="newpass-error"></p>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <label>Email
        <input type="email" id="signup-email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
      <p class="auth-error" id="signup-error"></p>
      <p class="auth-note" id="signup-note"></p>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
